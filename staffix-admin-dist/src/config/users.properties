# Console users, read on every login: name = password, ROLE[, ROLE...]
# Roles: READER views, WRITER also changes (implies READER), ENGINE only announces engines.
# Passwords in Spring's {id}encoded form; from the console's directory, print one with:
#   java -Dloader.main=org.lolaf.staffix.admin.server.security.jaas.PasswordHasher -jar staffix-admin.jar 'secret'
# The default users' password is their name: change both before the console is reachable by anyone else.
admin = {noop}admin, WRITER
engine = {noop}engine, ENGINE
# reader = {noop}reader, READER
