name: staffix-admin-sandbox

services:

  # venue-x and venue-y's message stores, whatever telemetry profile runs: no volume, the sandbox recreates its tables
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: staffix
      POSTGRES_USER: staffix
      POSTGRES_PASSWORD: staffix
    ports:
      - "5432:5432"

  # where venue-x and venue-y post their alerts; its UI on http://localhost:9093
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./conf/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  otel-collector:
    image: otel/opentelemetry-collector:0.158.0
    profiles: [ prometheus-loki ]
    command: --config=/etc/otel/config.yaml
    ports:
      - "4318:4318"
    volumes:
      - ./conf/otel-collector.yaml:/etc/otel/config.yaml

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: [ prometheus-loki ]
    ports:
      - "9090:9090"
    volumes:
      - ./conf/prometheus.yml:/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:3.7.8
    profiles: [ prometheus-loki ]
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./conf/loki.yaml:/etc/loki/loki.yaml
    ports:
      - "3100:3100"

  # both consoles listen on 8080 (host network): run one at a time
  console-prometheus-loki: &console
    image: eclipse-temurin:21-jre
    profiles: [ console-prometheus-loki ]
    # the engines advertise their host name and the connectors name localhost: the console sees what the host sees
    network_mode: host
    command:
      - sh
      - -c
      - >-
        [ -f /data/console.yaml ] || cp /etc/staffix-admin/console.yaml /data/;
        exec java -Dloader.path=/app/plugins -jar /app/staffix-admin.jar --staffix.admin.data-dir=/data
        --staffix.admin.security.jaas-config=file:/etc/staffix-admin/jaas.conf
    volumes:
      - ../../staffix-admin-dist/target/staffix-admin/staffix-admin:/app:ro
      - ./conf/console/jaas.conf:/etc/staffix-admin/jaas.conf:ro
      - ./conf/console/users.properties:/etc/staffix-admin/users.properties:ro
      - ../console-prometheus-loki.yaml:/etc/staffix-admin/console.yaml:ro
      - console-data:/data

  # the same console, with the Elasticsearch connectors as defaults
  console-es:
    <<: *console
    profiles: [ console-es ]
    volumes:
      - ../../staffix-admin-dist/target/staffix-admin/staffix-admin:/app:ro
      - ./conf/console/jaas.conf:/etc/staffix-admin/jaas.conf:ro
      - ./conf/console/users.properties:/etc/staffix-admin/users.properties:ro
      - ../console-es.yaml:/etc/staffix-admin/console.yaml:ro
      - console-es-data:/data

  # the same console, with the ClickHouse connectors as defaults
  console-clickhouse:
    <<: *console
    profiles: [ console-clickhouse ]
    volumes:
      - ../../staffix-admin-dist/target/staffix-admin/staffix-admin:/app:ro
      - ./conf/console/jaas.conf:/etc/staffix-admin/jaas.conf:ro
      - ./conf/console/users.properties:/etc/staffix-admin/users.properties:ro
      - ../console-clickhouse.yaml:/etc/staffix-admin/console.yaml:ro
      - console-clickhouse-data:/data

  # Elasticsearch and Kibana behind their own collector on 4320: run the engines with -DotlpUrl=http://localhost:4320
  otel-collector-elastic:
    image: otel/opentelemetry-collector-contrib:0.158.0
    profiles: [ kibana ]
    command: --config=/etc/otel/config.yaml
    ports:
      - "4320:4320"
    volumes:
      - ./conf/otel-collector-elastic.yaml:/etc/otel/config.yaml
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: elasticsearch:9.5.3
    profiles: [ kibana ]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow" ]
      interval: 5s
      timeout: 5s
      retries: 30

  kibana:
    image: kibana:9.5.3
    profiles: [ kibana ]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ClickHouse behind its own collector on 4321: run the engines with -DotlpUrl=http://localhost:4321
  otel-collector-clickhouse:
    image: otel/opentelemetry-collector-contrib:0.158.0
    profiles: [ clickhouse ]
    command: --config=/etc/otel/config.yaml
    ports:
      - "4321:4321"
    volumes:
      - ./conf/otel-collector-clickhouse.yaml:/etc/otel/config.yaml
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: [ clickhouse ]
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
    ports:
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --user otel --password otel --query 'SELECT 1'" ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  console-data:
  console-es-data:
  console-clickhouse-data:
  elasticsearch-data:
  clickhouse-data:
