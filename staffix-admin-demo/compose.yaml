# The whole demo, from what ./mvnw install built: docker compose up (pull_policy build rebuilds the images each time)
name: staffix-admin-demo

services:

  console:
    build: staffix-admin-dist-demo
    pull_policy: build
    image: staffix-admin-demo-console
    ports:
      - "8080:8080"
    volumes:
      - console-data:/data

  simulator:
    build: staffix-admin-simulator
    pull_policy: build
    image: staffix-admin-simulator
    # the engines advertise their host name, which the console resolves on this network
    hostname: simulator
    environment:
      JAVA_OPTS: -DconsoleUrl=http://console:8080
    depends_on:
      - console

volumes:
  console-data:
